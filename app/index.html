<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="Calcula la distancia en línea recta hasta un restaurante de Santiago"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Distancia a restaurantes</title>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <header class="hero">
      <div class="shell">
        <p class="eyebrow">¿Qué tan lejos?</p>
        <h1>Restaurantes de Santiago</h1>
        <p>Selecciona un restaurante de destino y calcula qué tan lejos está.</p>
      </div>
    </header>

    <main class="shell">
      <section aria-labelledby="restaurant-title">
        <h2 id="restaurant-title">¿Dónde quieres ir?</h2>
        <select id="restaurant-select" aria-labelledby="restaurant-title">
          <option value="">Seleccionar un restaurante</option>
        </select>

        <output
          id="restaurant-coordinates"
          class="coordinates"
          aria-live="polite"
          hidden
        >
        </output>
      </section>

      <section id="origins-section" aria-labelledby="origins-title" hidden>
        <h2 id="origins-title">¿Dónde estás?</h2>

        <div class="origin-grid">
          <article class="origin-card" aria-labelledby="station-title">
            <h3 id="station-title">Estación de Metro</h3>
            <select id="station-select" aria-labelledby="station-title">
              <option value="">Seleccionar una estación</option>
            </select>

            <output
              id="station-coordinates"
              class="coordinates"
              aria-live="polite"
              hidden
            >
            </output>

            <button id="calculate-station" type="button" disabled hidden>
              Calcular distancia
            </button>
          </article>

          <section
            id="location-section"
            class="origin-card"
            aria-labelledby="location-title"
            hidden
          >
            <h3 id="location-title">Mi ubicación</h3>

            <output
              id="location-output"
              class="coordinates"
              aria-live="polite"
            >
              Comprobando el permiso…
            </output>

            <div class="actions">
              <button id="request-location" type="button">
                Solicitar acceso
              </button>
              <button
                id="calculate-location"
                class="secondary"
                type="button"
                disabled
                hidden
              >
                Calcular distancia
              </button>
            </div>
          </section>
        </div>

      </section>

      <section id="distance-section" aria-labelledby="distance-title" hidden>
        <h2 id="distance-title">¿Qué tan lejos?</h2>
        <output id="distance-result" class="result" aria-live="polite">
        </output>
      </section>
    </main>

    <footer>
      <div class="shell">ICC4203 · Aplicaciones Móviles</div>
    </footer>
  </body>
</html>
